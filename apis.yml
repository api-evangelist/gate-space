aid: gate-space
name: GATE Space
description: >-
  GATE Space is an Austrian aerospace company redefining in-space mobility with
  high-thrust chemical propulsion systems for satellites, capsules, and landing
  vehicles. A TU Wien spinout founded in 2022 and backed by Techstars, the
  company builds the GATE Jetpack — a plug-and-play, refuelable propulsion module
  running on green propellants that lets satellites perform rapid orbit and
  attitude maneuvers with no integration effort. Its patented engines have been
  validated across 8,000+ hot-fire tests in atmospheric and vacuum conditions,
  manufactured in a European facility with a 98% local supply chain. GATE Space
  raised €6.3M via the EIC Accelerator and its propulsion system will fly on
  BeaconSat, Austria's first military satellite. This is a hardware manufacturer
  with no public developer/API surface; the profile is maintained in the API
  Evangelist network as a company identity record.
